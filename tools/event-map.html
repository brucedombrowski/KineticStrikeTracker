<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinetic Strike Tracker — event map</title>
<style>
  /* Self-contained: coastline embedded, no tile server, no external requests.
     Reads ../out/events.geojson produced by `kst report`. */
  :root { --bg:#f7f7fa; --fg:#1a1a2e; --muted:#5a5a72; --line:#d0d0dc;
          --sea:#e6ecf2; --land:#ffffff; --panel:#ffffff;
          --expl:#c02020; --quake:#2a6fb0; --indet:#8a8a9c; --blast:#b07a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12121a; --fg:#e8e8f0; --muted:#9a9ab0; --line:#33334a;
            --sea:#0d1620; --land:#1c1c28; --panel:#1a1a24;
            --expl:#ff6b6b; --quake:#6fb3ff; --indet:#8a8a9c; --blast:#e8b34d; }
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;flex-direction:column}
  header{padding:.6rem 1rem;border-bottom:1px solid var(--line);
         display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap}
  h1{font-size:1rem;margin:0}
  #meta{color:var(--muted);font-size:.82rem}
  #wrap{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block;background:var(--sea);cursor:grab}
  svg.dragging{cursor:grabbing}
  .land{fill:var(--land);stroke:var(--line);stroke-width:.5;vector-effect:non-scaling-stroke}
  .border{fill:none;stroke:var(--muted);stroke-width:.6;opacity:.55;
          stroke-dasharray:2.5 1.8;vector-effect:non-scaling-stroke}
  .grat{stroke:var(--line);stroke-width:.4;fill:none;opacity:.5;vector-effect:non-scaling-stroke}
  .refpt{fill:none;stroke:#00b0b0;stroke-width:1.6;vector-effect:non-scaling-stroke}
  .reflbl{fill:#00b0b0;font-size:9px;paint-order:stroke;stroke:var(--sea);stroke-width:2.5px}
  .ring{fill:none;stroke:#00b0b0;stroke-width:.8;opacity:.45;stroke-dasharray:4 3;
        vector-effect:non-scaling-stroke}
  .ringlbl{fill:#00b0b0;font-size:8px;opacity:.8;paint-order:stroke;stroke:var(--sea);stroke-width:2.5px}
  .rangeline{stroke:#00b0b0;stroke-width:.9;opacity:.5;stroke-dasharray:3 2;
             vector-effect:non-scaling-stroke}
  .unc{fill:currentColor;opacity:.10;stroke:currentColor;stroke-opacity:.35;
       stroke-width:.7;vector-effect:non-scaling-stroke}
  .pt{stroke:#000;stroke-opacity:.35;stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer}
  .surface-explosion{color:var(--expl);fill:var(--expl)}
  .natural-earthquake{color:var(--quake);fill:var(--quake)}
  .industrial-blast{color:var(--blast);fill:var(--blast)}
  .indeterminate{color:var(--indet);fill:var(--indet)}
  #panel{position:absolute;top:.75rem;right:.75rem;width:22rem;max-width:calc(100% - 1.5rem);
         max-height:calc(100% - 1.5rem);overflow:auto;background:var(--panel);
         border:1px solid var(--line);border-radius:10px;padding:.8rem;
         box-shadow:0 6px 24px rgba(0,0,0,.16);font-size:.83rem}
  #panel h2{margin:.1rem 0 .5rem;font-size:.95rem}
  #panel dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;
            letter-spacing:.04em;margin-top:.5rem}
  #panel dd{margin:.1rem 0}
  #legend{position:absolute;left:.75rem;bottom:.75rem;background:var(--panel);
          border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;font-size:.78rem}
  .sw{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.4rem;
      vertical-align:-1px}
  #controls{position:absolute;left:.75rem;top:.75rem;background:var(--panel);
            border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.78rem}
  #controls label{display:block;margin:.15rem 0}
  #time{position:absolute;left:50%;transform:translateX(-50%);bottom:.75rem;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:.55rem .8rem;display:flex;gap:.6rem;align-items:center;
        min-width:min(46rem,calc(100% - 1.5rem));box-shadow:0 4px 18px rgba(0,0,0,.14)}
  #time input[type=range]{flex:1}
  #clock{font-variant-numeric:tabular-nums;font-weight:600;min-width:11.5rem}
  #daynight{display:flex;align-items:center;gap:.4rem;min-width:9.5rem}
  #dnicon{font-size:1.25rem;line-height:1;filter:drop-shadow(0 0 6px currentColor)}
  #dnlabel{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.15}
  #dnlabel b{display:block;color:var(--fg);font-size:.8rem}
  #sky{position:absolute;inset:0;pointer-events:none;transition:background .25s linear}
  #tally{color:var(--muted);font-size:.78rem;min-width:7rem;text-align:right}
  #speed{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:.15rem .3rem}
  button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);
         border-radius:6px;padding:.2rem .55rem;cursor:pointer}
  .warn{color:var(--expl);font-weight:600}
  code{background:var(--bg);padding:.05em .3em;border-radius:3px;font-size:.9em}
</style>
</head>
<body>
<header>
  <h1>Kinetic Strike Tracker</h1>
  <span id="meta">loading ../out/events.geojson …</span>
</header>
<div id="wrap">
  <svg id="map"><g id="scene"></g></svg>
  <div id="sky"></div>
  <div id="controls">
    <label><input type="checkbox" id="showUnc" checked> show location uncertainty</label>
    <label><input type="checkbox" id="hideUnusable"> hide location=unusable</label>
    <label><input type="checkbox" id="showRef"> reference layer</label>
    <label><input type="checkbox" id="showRings"> distance rings</label>
    <button id="fit">fit to events</button>
    <button id="world">world</button>
  </div>
  <div id="legend"></div>
  <div id="time">
    <button id="play">▶ play</button>
    <span id="daynight"><span id="dnicon">☀</span>
      <span id="dnlabel"><b id="dnday">—</b><span id="dntime"></span></span></span>
    <span id="clock">—</span>
    <input type="range" id="scrub" min="0" max="1000" value="1000">
    <select id="speed" title="playback pace">
      <option value="0.5">½ day / sec</option>
      <option value="1">1 day / sec</option>
      <option value="3" selected>3 days / sec</option>
      <option value="7">1 week / sec</option>
      <option value="30">1 month / sec</option>
    </select>
    <span id="tally"></span>
  </div>
  <div id="panel" hidden></div>
</div>

  refLayer=null;
  if(!$("#showRef").checked && !$("#showRings").checked) return;
  refLayer=el("g"); scene.append(refLayer);
  const a=refAnchor();
  const dpp=degPerPx();

  if(a && $("#showRings").checked){
    for(const km of [100,200,300,500,1000]){
      const ry=kmToDegLat(km);
      const c=el("ellipse");
      c.setAttribute("cx",a.lon); c.setAttribute("cy",-a.lat);
      c.setAttribute("ry",ry);
      c.setAttribute("rx",ry/Math.max(.15,Math.cos(a.lat*Math.PI/180)));
      c.setAttribute("class","ring"); refLayer.append(c);
      const t=el("text");
      t.setAttribute("x",a.lon); t.setAttribute("y",-(a.lat+ry)-2*dpp);
      t.setAttribute("text-anchor","middle");
      t.setAttribute("class","ringlbl");
      t.setAttribute("font-size",(8*dpp));
      t.textContent=km+" km";
      refLayer.append(t);
    }
  }
  if($("#showRef").checked){
    for(const p of refPoints){
      if(a){   // range line from the anchor to each site
        const l=el("line");
        l.setAttribute("x1",a.lon); l.setAttribute("y1",-a.lat);
        l.setAttribute("x2",p.lon); l.setAttribute("y2",-p.lat);
        l.setAttribute("class","rangeline"); refLayer.append(l);
      }
      const g=el("g");
      const r=4*dpp;
      const tri=el("path");
      tri.setAttribute("d",`M${p.lon},${-p.lat-r} L${p.lon+r},${-p.lat+r*0.8} L${p.lon-r},${-p.lat+r*0.8} Z`);
      tri.setAttribute("class","refpt"); g.append(tri);
      const t=el("text");
      t.setAttribute("x",p.lon+r*1.4); t.setAttribute("y",-p.lat+r*0.6);
      t.setAttribute("class","reflbl"); t.setAttribute("font-size",(9*dpp));
      t.textContent = p.km!=null ? `${p.name} — ${p.km} km` : p.name;
      g.append(t);
      refLayer.append(g);
    }
  }
}
$("#showRef").onchange=()=>{loadRef().then(drawReference)};
$("#showRings").onchange=drawReference;
let refLoaded=false;
function loadRef(){
  if(refLoaded) return Promise.resolve();
  return fetch("../data/reference/seismic-stations-hormuz.json")
    .then(r=>r.ok?r.json():[]).then(j=>{refPoints=j; refLoaded=true;})
    .catch(()=>{refPoints=[];refLoaded=true;});
}

// --- playback ---
function setCursor(c){
  cursor=Math.max(0,Math.min(1,c));
  $("#scrub").value=String(Math.round(cursor*1000));
  applyTime(true);
}
function stop(){ playing=false; if(raf)cancelAnimationFrame(raf); raf=null; $("#play").textContent="▶ play"; }
function tick(ts){
  if(!playing) return;
  const dt=lastFrame? (ts-lastFrame)/1000 : 0; lastFrame=ts;
  const daysPerSec=Number($("#speed").value);
  const spanDays=(tspan.max-tspan.min)/86400000 || 1;
  cursor += (dt*daysPerSec)/spanDays;
  if(cursor>=1){ cursor=1; stop(); setCursor(1); return; }
  $("#scrub").value=String(Math.round(cursor*1000));
  applyTime(false);
  raf=requestAnimationFrame(tick);
}
$("#play").onclick=()=>{
  if(playing){ stop(); return; }
  if(cursor>=1) cursor=0;              // replay from the start
  playing=true; lastFrame=0; $("#play").textContent="❚❚ pause";
  raf=requestAnimationFrame(tick);
};
$("#scrub").oninput=e=>{ stop(); setCursor(Number(e.target.value)/1000); };
$("#speed").onchange=()=>{ lastFrame=0; };
$("#fit").onclick=fit;
$("#world").onclick=()=>{view={x:-180,y:-90,w:360,h:180};applyView();draw()};
$("#showUnc").onchange=rebuild; $("#hideUnusable").onchange=rebuild;
addEventListener("resize",applyView);
svg.addEventListener("click",()=>$("#panel").hidden=true);

drawBase(); applyView();
fetch("../out/events.geojson").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
 .then(gj=>{
   events=gj.features.map(f=>{
     const p=f.properties, c=f.geometry.coordinates;
     const unc=(p.constituents||[]).reduce((m,x)=>Math.max(m,x.location_uncertainty_km||0),0);
     const mags=(p.constituents||[]).map(x=>x.magnitude).filter(v=>v!=null);
     return {lon:c[0],lat:c[1],cls:p.classification,time:p.origin_time,
       occ:p.confidence.occurrence,loc:p.confidence.location,chr:p.confidence.characterisation,
       n:p.independent_sources,cons:p.constituents||[],reasons:p.discrimination_reasons||[],
       unc, mag:mags.length?Math.max(...mags):null};
   });
   for(const e of events) e.t=Date.parse(e.time);
   events.sort((a,b)=>a.t-b.t);
   const ts=events.map(e=>e.t).filter(t=>!isNaN(t));
   if(ts.length){ tspan={min:Math.min(...ts),max:Math.max(...ts)}; }
   legend(); fit();
 })
 .catch(err=>{
   $("#meta").textContent="Could not load ../out/events.geojson ("+err.message+
     "). Run: kst report   — then serve the repo over HTTP (python3 -m http.server) and reload.";
 });
</script>
